# =============================================
#  Ford SpecPulse API ? perfil Oracle
#  Ativar com: -Dspring.profiles.active=oracle
#
#  Pre-requisito: criar o usuario Oracle:
#    CREATE USER specpulse IDENTIFIED BY specpulse123;
#    GRANT CONNECT, RESOURCE TO specpulse;
#    GRANT UNLIMITED TABLESPACE TO specpulse;
# =============================================

# ---- Oracle JDBC ----
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=specpulse
spring.datasource.password=specpulse123

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate

# ---- Flyway Oracle ----
spring.flyway.locations=classpath:db/migration-oracle
spring.flyway.baseline-on-migrate=true

# ---- H2 Console desabilitado em Oracle ----
spring.h2.console.enabled=false