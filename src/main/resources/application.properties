# =============================================
#  Ford SpecPulse API ? configuracao principal
#  SPRINT 1/2 SOA ? FIAP 2026
# =============================================

spring.application.name=ford-spec-pulse-api

# =============================================
# BANCO DE DADOS ? H2 (padrao dev)
# Para Oracle: -Dspring.profiles.active=oracle
# =============================================
spring.datasource.url=jdbc:h2:file:./data/specpulse;DB_CLOSE_DELAY=-1;MODE=LEGACY;CIPHER=AES
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=specpulse-file-key specpulse-user-pass

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =============================================
# H2 CONSOLE (apenas dev ? desabilitar em prod)
# =============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# SERVIDOR
# =============================================
server.port=8443

# ---- HTTPS / TLS (ativar em producao) ----
# Gerar keystore:
#   keytool -genkeypair -alias specpulse -keyalg RSA -keysize 2048
#     -storetype PKCS12 -keystore src/main/resources/certs/specpulse.p12
#     -validity 365 -storepass specpulse123
#     -dname "CN=ford-spec-pulse,OU=FIAP,O=Ford,L=SP,S=SP,C=BR"
#
server.ssl.enabled=false
server.ssl.key-store=classpath:certs/specpulse.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:specpulse123}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=specpulse
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256,ECDHE-RSA-AES256-GCM-SHA384

# Redirecionar HTTP ? HTTPS (ativar com ssl.enabled=true)
server.http-to-https-redirect.enabled=false
server.http-to-https-redirect.port=8080

# =============================================
# CXF SOAP
# =============================================
cxf.path=/soap
cxf.servlet.load-on-startup=1

# =============================================
# SPRINGDOC / SWAGGER
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

# =============================================
# JWT
# =============================================
specpulse.jwt.segredo=${SPECPULSE_JWT_SEGREDO:dev-segredo-minimo-32-caracteres-aqui}
specpulse.jwt.expiracao-acesso-ms=900000
specpulse.jwt.expiracao-refresh-ms=604800000

# =============================================
# CORS
# =============================================
specpulse.cors.origens=http://localhost:3000,http://localhost:5173

# =============================================
# RATE LIMIT
# =============================================
specpulse.rate-limit.geral=60
specpulse.rate-limit.auth=10

# =============================================
# HMAC ? integridade de payloads
# =============================================
specpulse.hmac.habilitado=false
specpulse.hmac.segredo=${SPECPULSE_HMAC_SEGREDO:dev-hmac-segredo-32-chars-aqui}

# =============================================
# SOAP ? autenticacao JWT
# =============================================
specpulse.soap.auth-habilitada=false

# =============================================
# RETENCAO DE DADOS
# =============================================
specpulse.retencao.dias-auditoria=90
specpulse.retencao.dias-tokens=7

# =============================================
# LOGGING ? sem dados sensiveis
# =============================================
logging.level.com.ford.specpulse=INFO
logging.level.org.apache.cxf=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# =============================================
# ACTUATOR (desabilitar em producao)
# =============================================
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
