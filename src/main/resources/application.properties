spring.application.name=ford-spec-pulse-api

spring.datasource.url=jdbc:h2:file:./data/specpulse;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Limites de payload (Bloco 1 - seguranca de entrada)
server.tomcat.max-http-form-post-size=512KB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=1MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT - HS256.
# IMPORTANTE: em ambientes nao-locais o segredo DEVE ser sobrescrito via variavel
# de ambiente SPECPULSE_JWT_SEGREDO. O valor abaixo e apenas para desenvolvimento.
specpulse.jwt.segredo=${SPECPULSE_JWT_SEGREDO:troque-este-segredo-de-32-caracteres-no-minimo-para-producao-ok}
specpulse.jwt.emissor=ford-spec-pulse-api
specpulse.jwt.expira-acesso-segundos=900
specpulse.jwt.expira-refresh-segundos=604800

# CORS - origens permitidas (separadas por virgula, sem espacos)
specpulse.cors.origens=http://localhost:3000,http://localhost:8081,http://localhost:19006,http://localhost:8080

logging.level.com.ford.specpulse=DEBUG
logging.level.org.springframework.security=INFO
