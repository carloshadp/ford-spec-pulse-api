# =============================================
# Profile so para demonstracao LOCAL de observabilidade
# (Sprint 3 - Cybersecurity, item de Observabilidade/Monitoramento).
#
# Ativar com: SPRING_PROFILES_ACTIVE=observabilidade
#
# Expoe /actuator/prometheus para o Prometheus coletar metricas e o
# Grafana montar dashboards (ver Entrega/monitoramento/docker-compose.yml).
# NUNCA usar este profile em producao: prometheus expoe contagem de
# requisicoes por rota, memoria da JVM etc. O profile "prod"
# (application-prod.properties) continua restrito a "health" apenas e
# tem prioridade caso os dois sejam combinados.
# =============================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=ford-spec-pulse-api
