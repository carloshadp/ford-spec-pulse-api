# =============================================================
#  Perfil PROD - endurecimento para deploy publico (Render)
#  Ativado com SPRING_PROFILES_ACTIVE=prod
#  Sobrescreve apenas o que e inseguro/ruidoso em producao;
#  o application.properties continua valendo para dev local.
# =============================================================

# ---- H2 CONSOLE: desligado ----
# Em dev o console e liberado por permitAll() no SecurityConfig. Exposto numa
# URL publica, qualquer pessoa entraria com sa + senha vazia e leria o banco
# inteiro (hashes de senha, audit log). Desligado aqui, o endpoint deixa de
# existir e o permitAll() passa a nao ter handler nenhum atras dele.
spring.h2.console.enabled=false

# ---- SQL e logs: sem verbosidade nem vazamento ----
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.com.ford.specpulse=INFO

# ---- Erros: nao devolver stacktrace ao cliente ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---- TLS terminado no proxy do Render ----
# O Render entrega HTTPS na borda e repassa HTTP ao container; manter o SSL do
# Tomcat desligado e confiar nos headers X-Forwarded-* para o app saber o
# esquema/host reais (usado no obterIpCliente do login e nas URLs do Swagger).
server.ssl.enabled=false
server.forward-headers-strategy=native

# ---- Actuator: somente health (usado pelo health check do Render) ----
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
