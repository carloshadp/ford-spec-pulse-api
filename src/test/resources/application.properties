# Configuracao de testes — H2 in-memory sem CIPHER
spring.datasource.url=jdbc:h2:mem:specpulsetest;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

server.port=0
spring.h2.console.enabled=false

specpulse.jwt.segredo=dev-segredo-minimo-32-caracteres-aqui
specpulse.jwt.emissor=ford-spec-pulse-api
specpulse.jwt.expira-acesso-segundos=900
specpulse.jwt.expira-refresh-segundos=604800

specpulse.cors.origens=http://localhost:3000
specpulse.rate-limit.geral=1000
specpulse.rate-limit.auth=500
specpulse.hmac.habilitado=false
specpulse.hmac.segredo=dev-hmac-segredo-32-chars-aqui
specpulse.retencao.dias-auditoria=90
specpulse.retencao.dias-tokens=7

logging.level.com.ford.specpulse=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
