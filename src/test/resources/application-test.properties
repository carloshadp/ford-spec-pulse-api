# Perfil de testes: banco em memoria (nao toca ./data) e rate limit alto,
# para que a suite inteira, vinda do mesmo IP, nao receba 429.
# O rate limit em si e testado isoladamente em RateLimitFilterTest.
spring.datasource.url=jdbc:h2:mem:specpulse-test;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.h2.console.enabled=false

specpulse.rate-limit.geral=100000
specpulse.rate-limit.auth=100000

logging.level.com.ford.specpulse=WARN
