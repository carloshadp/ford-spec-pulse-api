name: DevSecOps Pipeline

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    name: Build + testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e testes (JUnit + JaCoCo)
        run: mvn -B -ntp verify
      - name: Publicar relatorio de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java p/owasp-top-ten p/secrets

  secret-scanning:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        # Sem NVD_API_KEY, o primeiro download da base do NVD e sujeito a rate
        # limit e pode falhar/demorar; configurar o secret evita isso.
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: true
      - name: Publicar relatorio de dependencias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-dependency-check
          path: target/dependency-check-report.html

  container-scan:
    name: Container security (Trivy)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t ford-spec-pulse-api:ci .
      - name: Trivy - varredura de vulnerabilidades na imagem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ford-spec-pulse-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
